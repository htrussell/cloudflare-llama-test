<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SLM Chatbox</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .chat-container {
      width: 100%;
      max-width: 650px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      height: 85vh;
      overflow: hidden;
    }
    .chat-header {
      padding: 14px 18px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
    }
    .chat-header h3 { margin: 0; font-size: 1.1rem; color: #111827; }
    .clear-btn {
      background: transparent;
      border: 1px solid #d1d5db;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #4b5563;
    }
    .clear-btn:hover { background: #f3f4f6; color: #111827; }

    .chat-log {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 10px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .message.assistant {
      align-self: flex-start;
      background: #f3f4f6;
      color: #1f2937;
      border-bottom-left-radius: 2px;
    }

    /* Markdown elements styling inside assistant messages */
    .message.assistant p:first-child { margin-top: 0; }
    .message.assistant p:last-child { margin-bottom: 0; }
    .message.assistant pre {
      background: #e5e7eb;
      padding: 8px;
      border-radius: 6px;
      overflow-x: auto;
    }
    .message.assistant code {
      font-family: monospace;
      background: #e5e7eb;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .message.assistant pre code { background: none; padding: 0; }

    .chat-input-area {
      padding: 12px 16px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 8px;
      background: #ffffff;
    }
    .chat-input-area textarea {
      flex: 1;
      resize: none;
      height: 44px;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }
    .chat-input-area textarea:focus { border-color: #2563eb; }
    .send-btn {
      padding: 0 18px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
    }
    .send-btn:disabled { background: #93c5fd; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h3>SLM Assistant</h3>
      <button class="clear-btn" onclick="clearHistory()">Reset Memory</button>
    </div>

    <div class="chat-log" id="chatLog">
      <div class="message assistant">Hello! What can I help you with today?</div>
    </div>

    <div class="chat-input-area">
      <textarea id="promptInput" placeholder="Type a message... (Press Enter to send)" rows="1"></textarea>
      <button id="sendBtn" class="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://llama-3b-test.htrussell.workers.dev";

    // Manage a persistent session UUID for memory tracking
    let sessionId = localStorage.getItem("slm_session_id");
    if (!sessionId) {
      sessionId = crypto.randomUUID();
      localStorage.setItem("slm_session_id", sessionId);
    }

    const chatLog = document.getElementById("chatLog");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");

    // Allow Enter key to submit
    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const prompt = promptInput.value.trim();
      if (!prompt) return;

      // 1. Append User Message
      appendMessage("user", prompt);
      promptInput.value = "";
      sendBtn.disabled = true;

      // 2. Prepare Assistant Message Placeholder
      const assistantMessageElem = appendMessage("assistant", "<em>Thinking...</em>");
      chatLog.scrollTop = chatLog.scrollHeight;

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt, sessionId }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: res.statusText }));
          assistantMessageElem.textContent = `Error: ${err.error || "Request failed"}`;
          return;
        }

        // 3. Read Streamed Chunks
        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        let accumulatedMarkdown = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || !trimmed.startsWith("data:")) continue;

            const dataStr = trimmed.replace(/^data:\s*/, "");
            if (dataStr === "[DONE]") continue;

            try {
              const parsed = JSON.parse(dataStr);
              if (parsed.response) {
                accumulatedMarkdown += parsed.response;
                assistantMessageElem.innerHTML = marked.parse(accumulatedMarkdown);
                chatLog.scrollTop = chatLog.scrollHeight;
              }
            } catch {}
          }
        }
      } catch (err) {
        assistantMessageElem.textContent = `Network Error: ${err.message}`;
      } finally {
        sendBtn.disabled = false;
        promptInput.focus();
      }
    }

    function appendMessage(role, content) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.innerHTML = content;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
      return div;
    }

    async function clearHistory() {
      try {
        await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId, action: "clear" }),
        });
      } catch {}

      // Reset frontend state
      sessionId = crypto.randomUUID();
      localStorage.setItem("slm_session_id", sessionId);
      chatLog.innerHTML = `<div class="message assistant">Memory cleared! How can I help you now?</div>`;
    }
  </script>
</body>
</html>
